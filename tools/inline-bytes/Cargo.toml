[package]
name = "inline-bytes"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "inline-bytes"
path = "src/main.rs"

[dependencies]
# DWARF parsing: we walk `.debug_info` for `DW_TAG_subprogram` and
# `DW_TAG_inlined_subroutine` DIEs, then use their address ranges to
# attribute `.text` bytes to source-level functions.
gimli = { version = "0.32", default-features = false, features = ["read", "std"] }
# Demangle Rust linkage names (`_ZN...`, `_R...`) into readable form
# like `ltop::run::{closure#0}`.
rustc-demangle = "0.1"
