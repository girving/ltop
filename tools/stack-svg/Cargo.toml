[package]
name = "stack-svg"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "stack-svg"
path = "src/main.rs"

[dependencies]
# DWARF parsing. Needed to extract `DW_TAG_inlined_subroutine` entries and
# their local-variable frame offsets, which is the only way to see the
# inlined-callee structure inside a merged frame (e.g. the 12 KB
# `ltop::run::{closure#0}` under opt-z + LTO).
gimli = { version = "0.32", default-features = false, features = ["read", "std"] }
